<!doctype html>
<!--
  Tela de sem-sinal do app instalado.

  Ela vive no aparelho, guardada pelo sw.js na instalação, e aparece no lugar
  do erro de rede do navegador. Por isso é HTML solto e não uma página do
  Next: quando ela faz falta, não há servidor para renderizar nada.

  Nada aqui vem de fora — cor, fonte e desenho estão no próprio arquivo. Um
  <link> para o CSS do app seria mais uma requisição a falhar exatamente na
  hora em que a rede não existe.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1f4f7" />
    <title>Sem conexão · Morning Brief</title>
    <style>
      :root {
        --bg: #f1f4f7;
        --card: #ffffff;
        --line: #e3e8ee;
        --fg: #14181a;
        --dim: #4d565b;
        --mute: #666e74;
        --a: #287ee7;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui,
          -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .cartao {
        width: 100%;
        max-width: 380px;
        padding: 28px 24px 24px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 12px 32px -18px rgb(20 24 26 / 0.18);
        text-align: center;
      }
      .marca {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        border-radius: 15px;
        background:
          radial-gradient(circle at 7% 96%, rgba(126, 40, 231, 0.34), rgba(126, 40, 231, 0.08) 26%, transparent 52%),
          linear-gradient(150deg, #3a3a3a, #000000);
      }
      .marca svg {
        width: 26px;
        height: 30px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--mute);
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 11px 16px;
        border: 0;
        border-radius: 12px;
        background: var(--a);
        color: #fff;
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 170ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      button:hover {
        background: #1f66bd;
      }
      button:focus-visible {
        outline: 2px solid var(--a);
        outline-offset: 2px;
      }
      .aviso {
        margin-top: 14px;
        font-size: 12px;
        color: var(--dim);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div class="cartao">
      <div class="marca">
        <svg viewBox="0 0 261 300" fill="#fff" aria-hidden="true">
          <path d="M130.39 0C139.447 5.65775 149.893 11.3212 159.161 16.6904L221.396 52.6279C230.826 58.1389 240.291 63.5942 249.788 68.9932C251.811 70.151 258.786 74.4319 260.523 74.9941L260.543 225.513C227.298 244.24 194.053 263.953 160.923 283.001L139.804 295.186C138.776 295.776 132.275 299.783 131.328 299.54L131.287 299.525C131.572 297.583 131.568 293.896 131.625 291.823C131.738 287.606 131.884 283.391 132.065 279.176L134.195 216.67C134.673 203.948 134.286 190.292 137.162 177.995C139.785 167.022 144.556 156.679 151.198 147.561C152.283 146.076 154.355 143.451 155.798 142.325C169.505 131.647 188.321 128.211 204.719 125.69C188.379 124.522 167.023 118.686 154.086 108.165C139.708 96.4736 132.082 69.7786 130.52 51.9551C129.891 53.6036 128.624 61.9383 128.11 64.3916C125.264 77.9937 120.432 92.6805 111.334 103.389C99.3206 117.528 73.4633 124.513 55.5703 125.663C69.6255 127.791 83.1157 130.141 95.8848 136.741C101.977 139.89 105.178 141.781 109.262 147.403C116.372 157.193 121.399 168.14 123.883 180.003C125.46 187.308 125.586 193.648 125.888 201.048C126.195 209.028 126.453 217.01 126.661 224.995L129.073 295.798C129.064 297.13 129.027 298.57 129.058 299.893C124.991 297.81 120.233 294.895 116.23 292.58L30.2852 242.976L10.8018 231.69C7.64451 229.863 3.25988 227.161 0.0986328 225.658C0.28663 214.033 0.155527 202.078 0.155273 190.438L0.158203 93.8135C0.156953 88.7563 0.414721 79.9123 0 75.1445C11.4282 69.0495 23.2626 61.6892 34.6006 55.2744C66.6123 37.1627 98.3707 18.0487 130.39 0Z" />
        </svg>
      </div>

      <h1>Sem conexão</h1>
      <p>
        O Morning Brief precisa de internet para carregar o seu dia. Assim que
        o sinal voltar, toque em tentar de novo.
      </p>

      <button type="button" id="tentar">Tentar de novo</button>
      <div class="aviso" id="aviso"></div>
    </div>

    <script>
      // O botão recarrega; se ainda não há rede, diz isso em vez de piscar.
      var aviso = document.getElementById("aviso");
      document.getElementById("tentar").addEventListener("click", function () {
        if (navigator.onLine) location.reload();
        else aviso.textContent = "Ainda sem sinal.";
      });
      // Voltar o sinal recarrega sozinho: é o que se espera ao sair do túnel.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
